# `docker compose pull && docker compose up -d`, then open http://localhost:3001
#
# Both services name a published image and can also build it. Naming the image
# is what lets `docker compose pull` fetch what CI already built; the build
# stanza is still there so `--build` works on a change you have not pushed.
services:
  chromium:
    # A full Chromium in new-headless mode rather than the ready-made
    # headless-shell image: see Dockerfile.chromium for why. The switches live
    # in that file; the user agent and the rest of the anti-detection work are
    # applied per page, over the protocol.
    image: ghcr.io/kapsikkum/event-scout-chromium:latest
    build:
      context: .
      dockerfile: Dockerfile.chromium
    init: true
    # Chromium exhausts the default 64 MB /dev/shm and takes the renderer down
    # with it on any page worth scraping.
    shm_size: 512mb
    volumes:
      - chromium-profile:/profile
    # Deliberately not published to the host. An open CDP port is remote code
    # execution for anything that can reach it; the app container reaches it
    # over the compose network, and nothing else needs to.
    expose:
      - "9222"
    restart: unless-stopped

  app:
    image: ghcr.io/kapsikkum/event-scout:latest
    build: .
    environment:
      # Set means "attach to that browser"; unset means "start one locally",
      # which is what happens outside Docker. See openBrowser() in cdp.ts.
      BROWSER_CDP_URL: http://chromium:9222
      API_PORT: "3001"
      # Optional. Set it and reading stays open while changing anything — and
      # reading Settings, which carries every API key — needs the password.
      # Leave it unset to set one from the Settings page instead, or to run
      # wide open, which is what the port below is by default.
      AUTH_PASSWORD: 
      # An Ollama for the optional "read listings with a local model" task.
      # From inside a container the host's own Ollama is host.docker.internal,
      # never localhost — localhost here is this container. Only a default; the
      # Settings page can point it anywhere.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # Affects when an event counts as past. Override in a .env file
      # alongside this one, e.g. TZ=America/Denver.
      TZ: ${TZ:-Australia/Sydney}
    # Makes host.docker.internal resolve on Linux, where it otherwise does not.
    # Harmless on Docker Desktop, which provides it anyway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Published on every interface, so anything that can reach this machine can
    # reach the app. Set AUTH_PASSWORD above before exposing it beyond a network
    # you trust, or bind it to localhost with "127.0.0.1:3001:3001".
    ports:
      - "3001:3001"
    volumes:
      - event-scout-data:/app/data
    depends_on:
      - chromium
    restart: unless-stopped

volumes:
  event-scout-data:
  chromium-profile:
