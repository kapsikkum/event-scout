name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # The database layer uses node:sqlite, so nothing older will do.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: |
          # tsconfig.test.json, not tsconfig.json: the build config includes only
          # src, so a type error in a test file would otherwise reach nobody —
          # tsx strips types to run them without checking any of it.
          npx tsc --noEmit -p server/tsconfig.test.json
          npx tsc --noEmit -p web
          npx tsc --noEmit -p crawler/tsconfig.test.json
      - name: Unit tests
        run: |
          npm test --workspace server
          npm test --workspace crawler
      - name: Build
        run: npm run build

  # Keeps a release pull request up to date with whatever has landed on main
  # since the last release, bumping the version and writing the changelog from
  # the commit subjects. Merging that PR is what cuts a release; nothing is
  # released by simply pushing here.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      version: ${{ steps.semver.outputs.version }}
      minor: ${{ steps.semver.outputs.minor }}
      major: ${{ steps.semver.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The moving tags to publish alongside the exact one. Derived from
      # tag_name rather than the action's separate major/minor outputs, which
      # are the parts of its interface most likely to shift.
      - name: Work out the image tags
        id: semver
        if: steps.release.outputs.releases_created == 'true'
        run: |
          # Loudly, rather than tagging an image with an empty string: this is
          # the one place that depends on the shape of the action's output, and
          # a silent wrong answer here is published to a registry.
          if [ -z "$TAG" ]; then
            echo "release-please reported a release but named no tag" >&2
            exit 1
          fi
          version="${TAG#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$major.$minor" >> "$GITHUB_OUTPUT"
          # No floating :0 tag while the major is 0. Under semver a 0.x bump
          # may break things, so a tag spanning every 0.x would quietly move
          # across breaking changes — which is exactly what pinning avoids.
          if [ "$major" != "0" ]; then echo "major=$major" >> "$GITHUB_OUTPUT"; fi
        env:
          TAG: ${{ steps.release.outputs.tag_name }}

  images:
    # Runs whether or not a release happened: an ordinary push still refreshes
    # :latest, and a push that released also gets the version tags. Building
    # here rather than on the tag is deliberate — a tag pushed by the built-in
    # token does not start another workflow run, so a separate tag-triggered
    # job would never fire.
    #
    # Deliberately not gated on the release job succeeding. Publishing :latest
    # is what a deploy needs; whether a release pull request could be opened is
    # a separate concern, and letting it block the image left nothing to deploy.
    needs: [test, release]
    if: |
      always()
      && needs.test.result == 'success'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: event-scout
            dockerfile: Dockerfile
          - name: event-scout-chromium
            dockerfile: Dockerfile.chromium
          - name: event-scout-crawler
            dockerfile: Dockerfile.crawler
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided by Actions; no secret to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.released == 'true' }}
            type=raw,value=${{ needs.release.outputs.minor }},enable=${{ needs.release.outputs.released == 'true' }}
            type=raw,value=${{ needs.release.outputs.major }},enable=${{ needs.release.outputs.major != '' }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # amd64 only. The deploy target is a qemu guest on x86_64, and
          # building Chromium's image under arm64 emulation costs far more
          # than a second architecture is worth here.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # /api/version reports these. .git is not in the build context, so
          # the commit cannot be read from inside the build.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Zenith: see docs/zenith-deployment.md. On a pull request, the stack in
  # zenith-compose.yml boots with the pull request's own images swapped in; on
  # main, the manifest is only checked, since zenith-update boots main's images.
  zenith:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate the manifest
        run: docker compose -f zenith-compose.yml config --quiet

      - name: Build the images for linux/amd64
        if: github.event_name == 'pull_request'
        run: |
          docker build --platform linux/amd64 -t zenith-pr/event-scout -f Dockerfile .
          docker build --platform linux/amd64 -t zenith-pr/event-scout-crawler -f Dockerfile.crawler .
          docker build --platform linux/amd64 -t zenith-pr/event-scout-chromium -f Dockerfile.chromium .

      - name: Boot and check the stack
        if: github.event_name == 'pull_request'
        run: |
          sed -E 's#ghcr\.io/[a-z0-9_.-]+/(event-scout(-crawler|-chromium)?)@sha256:[a-f0-9]{64}#zenith-pr/\1#' \
            zenith-compose.yml > "$RUNNER_TEMP/zenith-pr.yml"
          test "$(grep -c 'image: zenith-pr/' "$RUNNER_TEMP/zenith-pr.yml")" = 3
          bash scripts/zenith-smoke.sh "$RUNNER_TEMP/zenith-pr.yml"

  # After main's images are published: verify and boot them as Zenith would
  # pull them, and prepare the pin update as an artifact to review. Nothing is
  # pushed or opened from here.
  zenith-update:
    needs: images
    if: always() && needs.images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify, boot and prepare the update
        env:
          SOURCE_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/zenith-prepare-image-update.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenith-image-update-${{ github.sha }}
          path: zenith-image-update/
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "### Zenith image update"
            if [ -f zenith-image-update/zenith-compose.patch ]; then
              echo "Prepared; review and apply the patch from the \`zenith-image-update-${GITHUB_SHA}\` artifact."
              echo '```diff'; cat zenith-image-update/zenith-compose.patch; echo '```'
            elif [ -f zenith-image-update/image.json ]; then
              echo "The manifest already pins these images."
            else
              echo "Not prepared; see the step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
