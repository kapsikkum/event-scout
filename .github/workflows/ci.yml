name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The database layer uses node:sqlite, so nothing older will do.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: |
          npx tsc --noEmit -p server
          npx tsc --noEmit -p web
      - name: Unit tests
        run: npm test --workspace server
      - name: Build
        run: npm run build

  images:
    # Only publish what the tests already passed on.
    needs: test
    # A pull request from a fork cannot be trusted with a package write token.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: event-scout
            dockerfile: Dockerfile
          - name: event-scout-chromium
            dockerfile: Dockerfile.chromium
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided by Actions; no secret to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # amd64 only. The deploy target is a qemu guest on x86_64, and
          # building Chromium's image under arm64 emulation costs far more
          # than a second architecture is worth here.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
